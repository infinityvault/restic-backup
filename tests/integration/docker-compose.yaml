services:
  restic-backup:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backup}
      RESTIC_PASSWORD: integration-test-password
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - data:/data
      - backup:/backup
      - ${RESTIC_BACKUP_IT_CONFIG_DIR}:/configs:ro

  minio:
    # MinIO's own images are gone: deleted from Docker Hub, quay.io needs a login since
    # 2026-09. Chainguard's build pulls anonymously (only :latest, runs as non-root).
    image: cgr.dev/chainguard/minio:latest
    command: server /tmp/minio --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

  minio-init:
    # Any S3 client works - creates the bucket once MinIO answers.
    image: amazon/aws-cli:latest
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until aws --endpoint-url http://minio:9000 s3api head-bucket --bucket restic-backup-it 2>/dev/null \
          || aws --endpoint-url http://minio:9000 s3 mb s3://restic-backup-it; do sleep 1; done

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root-secret

volumes:
  data:
  backup:
